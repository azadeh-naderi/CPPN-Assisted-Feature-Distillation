dataset_name: cifar_10
model_name: resnet18
input_channels: 3
num_classes: 10
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

# No `pretrained` flag -- this line of experiments has no teacher at all,
# so there's nothing to fine-tune; the student is always built from
# scratch (see online_distillation/scripts/train_student_online.py).

student:
  num_epochs: 100
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1
  temperature: 4
  alpha: 0.5

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  random_seed: 0
  # Attempt 2: a fixed random CPPN pattern for all 100 epochs (attempt 1,
  # EXPERIMENT_LOG.md) trains the model to be invariant to one specific,
  # arbitrary transform -- a narrower task than the genuine
  # augmentation-style regularization real per-batch augmentations
  # (crop/flip) provide by varying every step. resample_pattern draws a
  # fresh random genome/pattern at the start of every epoch instead
  # (~3ms/draw, measured locally -- negligible next to a full epoch of
  # gradient descent). Affects both modes when run via --modes all, not
  # just self_consistency_random_cppn.
  resample_pattern: true
