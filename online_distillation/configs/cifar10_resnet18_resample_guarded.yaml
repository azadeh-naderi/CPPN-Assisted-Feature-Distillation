dataset_name: cifar_10
model_name: resnet18
input_channels: 3
num_classes: 10
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

# No `pretrained` flag -- this line of experiments has no teacher at all,
# so there's nothing to fine-tune; the student is always built from
# scratch (see online_distillation/scripts/train_student_online.py).

student:
  num_epochs: 100
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1
  temperature: 4
  alpha: 0.5

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  random_seed: 0
  resample_pattern: true
  # Attempt 3: attempt 2's unguarded resampling (cifar10_resnet18_resample.yaml)
  # regressed accuracy by 10-14 points -- training curves showed repeated
  # crash-and-partial-recover cycles throughout the run, not a single bad
  # draw. Root cause: apply_pattern's multiplicative view is
  # `image * pattern`, so a low-mean pattern is a near-blackout mask, the
  # exact mechanism behind the main pipeline's worst evolved-genome
  # collapses -- but random genomes here get none of the guardrails
  # evolved genomes do. A 200-draw local sample of unconstrained random
  # genomes found 47% have std > 0.2 (the main pipeline's own validated
  # "harmful contrast" threshold, see ../../configs/datasets/cifar10_resnet18.yaml's
  # contrast_std_threshold) and 35% have mean outside [0.2, 0.8].
  # max_pattern_std/min_pattern_mean reject-and-redraw any resampled
  # pattern outside these bounds before accepting it for that epoch.
  max_pattern_std: 0.2
  min_pattern_mean: 0.3
