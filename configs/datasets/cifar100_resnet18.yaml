dataset_name: cifar_100
model_name: resnet18
# Teacher uses ImageNet-pretrained weights (student is always built
# pretrained=False regardless of this flag -- src/scripts/train_student.py
# -- so this only affects the teacher). A real 10-seed run with lr=0.1
# (matching the student, see git history) confirmed the anticipated risk:
# teacher mean 43.55% vs student_only's 49.39%, the same mechanism that
# broke CIFAR-10's teacher in attempt 1 (a from-scratch-appropriate lr
# wrecking pretrained features during fine-tuning). Reverted teacher.lr
# back to a fine-tuning-appropriate 0.01 below.
pretrained: true
input_channels: 3
num_classes: 100
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

teacher:
  # Reverted lr from 0.1 back to a fine-tuning-appropriate 0.01 (see the
  # pretrained: comment above -- lr=0.1 confirmed broken in a real 10-seed
  # run). step_size=100 with num_epochs=200 gives one decay at the halfway
  # point: epochs 0-99 at lr=0.01, 100-199 at lr=0.001 -- the same schedule
  # shape validated (structurally, via a single-seed run reaching 47.8%
  # test accuracy at 150 epochs) earlier in this config's history, before
  # the lr=0.1 experiment. This exact lr=0.01/step_size=100/num_epochs=200
  # combination has not itself been single-seed-validated yet -- worth a
  # cheap standalone teacher run before trusting a full 10-seed sweep.
  num_epochs: 200
  lr: 0.01
  momentum: 0.9
  scheduler: true
  step_size: 100
  gamma: 0.1

student:
  num_epochs: 200
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 66
  gamma: 0.1
  temperature: 4
  # see configs/datasets/cifar10_resnet18.yaml -- reverted to alpha=0.9, no
  # cppn_weight (loss-reweighting attempts didn't help on CIFAR-10; not
  # independently tested for CIFAR-100).
  alpha: 0.9

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  # see configs/datasets/cifar10_resnet18.yaml for why tau_low is raised
  # from 0.3 -- same reasoning applies here, not yet independently confirmed
  # for CIFAR-100.
  tau_low: 0.5
  tau_high: 0.7
  gamma: 0.0
  # see configs/datasets/cifar10_resnet18.yaml for the contrast_penalty and
  # contrast_std_threshold rationale -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  contrast_penalty: 0.3
  contrast_std_threshold: 0.2
  # see configs/datasets/cifar10_resnet18.yaml for the channel_divergence_penalty
  # rationale (attempt 11) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  channel_divergence_penalty: 0.3
  # see configs/datasets/cifar10_resnet18.yaml for the min_connections
  # rationale (attempt 12) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  min_connections: 1
  # see configs/datasets/cifar10_resnet18.yaml for the min_pattern_std
  # rationale (attempt 13) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  min_pattern_std: 0.01
  probe_batch_size: 256
  num_generations: 40
  top_k: 5
  random_seed: 0

trained_cppn:
  num_steps: 500
  probe_batch_size: 256
  lr: 0.01
  temperature: 4
  diversity_weight: 1.0
  kl_weight: 1.0
