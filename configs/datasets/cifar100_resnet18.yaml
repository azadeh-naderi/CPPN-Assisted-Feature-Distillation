dataset_name: cifar_100
model_name: resnet18
pretrained: true
input_channels: 3
num_classes: 100
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

teacher:
  # see configs/datasets/cifar10_resnet18.yaml for why teacher lr is kept
  # low + decayed here (fine-tuning a pretrained backbone, not training
  # from scratch).
  #
  # step_size raised from 30: a real 10-seed CIFAR-100 run with step_size=30
  # showed the teacher was still climbing steadily right up to the first
  # decay (44.66% at epoch 27 -> 47.90% at epoch 30), then completely
  # plateaued for the remaining 70 epochs (oscillating 46-47.5%, essentially
  # zero net improvement) once lr dropped 10x to 0.001. The teacher ended up
  # *worse* than the from-scratch student in every one of the 10 seeds
  # (mean 46.18% vs 48.89%), invalidating every KD-mode comparison in that
  # run the same way CIFAR-10's very first attempt was invalidated
  # (EXPERIMENT_LOG.md). CIFAR-100's 100-class task, with the same recipe
  # that worked fine on CIFAR-10, evidently needs more time at the initial
  # lr to converge before any decay -- 60 gives it twice as long.
  #
  # num_epochs raised from 100 (then 150): a single-seed validation run
  # with step_size=60 improved the teacher (46.18% mean -> 47.8%
  # single-seed test) but still landed below student_only's original
  # 48.89% mean -- the post-decay phase (epochs 60-99, lr=0.001) was still
  # inching upward in a noisy band (46.92% -> 48.7%) without having
  # clearly flattened by epoch 99. Raised further to 200 (step_size
  # unchanged at 60) for four lr stages across three decays: 0-59 at lr,
  # 60-119 at lr*0.1, 120-179 at lr*0.01, 180-199 at lr*0.001 --
  # not independently re-validated at 200 before committing to a full
  # 10-seed run (only the 150-epoch step was validated single-seed); if
  # the teacher still trails student_only, check training_log.csv for
  # this specific run before trusting any KD-mode comparison.
  num_epochs: 200
  lr: 0.01
  momentum: 0.9
  scheduler: true
  step_size: 60
  gamma: 0.1

student:
  # step_size raised from 30 for the same diagnosed reason as teacher above
  # -- the student's training curve showed the identical pattern (climbing
  # to 43.92% by epoch 29, jumping to 47.5% right at the old decay point,
  # then flat for 70 epochs), confirming this is a shared schedule issue
  # affecting both models, not teacher-specific. num_epochs raised to 200
  # alongside the teacher's, for the same reasoning.
  num_epochs: 200
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 60
  gamma: 0.1
  temperature: 4
  # see configs/datasets/cifar10_resnet18.yaml -- reverted to alpha=0.9, no
  # cppn_weight (loss-reweighting attempts didn't help on CIFAR-10; not
  # independently tested for CIFAR-100).
  alpha: 0.9

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  # see configs/datasets/cifar10_resnet18.yaml for why tau_low is raised
  # from 0.3 -- same reasoning applies here, not yet independently confirmed
  # for CIFAR-100.
  tau_low: 0.5
  tau_high: 0.7
  gamma: 0.0
  # see configs/datasets/cifar10_resnet18.yaml for the contrast_penalty and
  # contrast_std_threshold rationale -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  contrast_penalty: 0.3
  contrast_std_threshold: 0.2
  # see configs/datasets/cifar10_resnet18.yaml for the channel_divergence_penalty
  # rationale (attempt 11) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  channel_divergence_penalty: 0.3
  # see configs/datasets/cifar10_resnet18.yaml for the min_connections
  # rationale (attempt 12) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  min_connections: 1
  # see configs/datasets/cifar10_resnet18.yaml for the min_pattern_std
  # rationale (attempt 13) -- same reasoning applies here, not yet
  # independently confirmed for CIFAR-100.
  min_pattern_std: 0.01
  probe_batch_size: 256
  num_generations: 40
  top_k: 5
  random_seed: 0

trained_cppn:
  num_steps: 500
  probe_batch_size: 256
  lr: 0.01
  temperature: 4
  diversity_weight: 1.0
  kl_weight: 1.0
