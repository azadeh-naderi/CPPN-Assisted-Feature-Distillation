dataset_name: cifar_10
model_name: resnet18
pretrained: true
input_channels: 3
num_classes: 10
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

teacher:
  # lr kept low relative to student's: teacher starts from pretrained
  # ImageNet weights (pretrained: true above) and is being fine-tuned, not
  # trained from scratch -- a from-scratch-appropriate lr like 0.1 here
  # wrecks the pretrained features early and left the teacher *worse* than
  # the from-scratch student in an earlier real run (78-81.5% vs 81.5-83.7%),
  # invalidating every KD comparison. step decay added since 100 epochs with
  # a flat lr is generally suboptimal for either regime.
  num_epochs: 100
  lr: 0.01
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1

student:
  num_epochs: 100
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1
  temperature: 4
  # Reverted to attempt 5's settings: alpha=0.9, no cppn_weight. Two rounds
  # of loss-reweighting (attempts 6-7, EXPERIMENT_LOG.md) both regressed
  # kd_evolved_cppn below attempt 5's ensemble-only result and reintroduced
  # the single-seed catastrophic-collapse instability -- that lever is
  # exhausted. This attempt (8) isolates a different variable (a direct
  # contrast penalty in the fitness function, see cppn.contrast_penalty
  # below) instead of stacking it on top of an already-shown-harmful change.
  alpha: 0.9

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  # tau_low raised from 0.3: with the OUTER_SIGMOID_SCALE range fix (see
  # src/cppn/compile.py), evolution can now reach high-contrast, near-binary
  # patterns (observed std=0.425, min=0.007/max=0.993 on a real run) that
  # amount to a static, always-in-the-same-place occlusion mask -- very
  # different from normal per-batch-random augmentation like Cutout, since
  # it's identical across every image and every epoch. 0.3 agreement on one
  # probe batch wasn't a strict enough bar to rule those out on its own.
  tau_low: 0.5
  tau_high: 0.7
  gamma: 0.0
  # Direct penalty on pattern std (contrast) in the fitness function itself,
  # rather than only gating on prediction agreement. Bad genomes found in
  # real runs consistently had pattern_std~0.4+ (a near-binary static
  # occlusion mask); range-capped patterns from before the
  # OUTER_SIGMOID_SCALE fix had std~0.16 and were comparatively harmless.
  # 0.3 chosen to be roughly the same order of magnitude as observed
  # best_fitness values (~0.03-0.22), so it meaningfully affects ranking
  # rather than being negligible.
  #
  # contrast_std_threshold gates the penalty so it only applies *above* this
  # value, instead of monotonically minimizing std. Without a threshold
  # (attempt 8), the penalty's minimum is std=0 exactly, and every winning
  # genome across all 3 seeds collapsed to a degenerate single-bias-node,
  # zero-connection constant pattern -- a uniform brightness scalar, not a
  # spatial view at all (still fixed the instability/cost, but isn't really
  # showcasing evolved spatial patterns). 0.2 sits between the "harmless"
  # 0.16 and "harmful" 0.4+ std values observed, leaving genomes with
  # moderate genuine spatial variation completely unpenalized.
  contrast_penalty: 0.3
  contrast_std_threshold: 0.2
  # Attempt 11: visualizing a real winning genome from attempt 10
  # (experiments/EXPERIMENT_LOG.md) showed a fixed magenta/green vertical
  # stripe artifact -- identical across every image regardless of content,
  # localized enough to pass both the top-1 and soft agreement checks while
  # still registering as "diverse" in teacher feature space. That artifact is
  # exactly what channel_divergence_term measures (per-pixel std across R/G/B
  # at the same spatial location). Unlike contrast_penalty this needs no
  # threshold: zero channel divergence doesn't collapse the genome to a
  # trivial constant, it just forces color channels to move together at each
  # pixel (a plain spatial luminance pattern is still fully expressible).
  # 0.3 chosen to match contrast_penalty's order of magnitude relative to
  # observed best_fitness values (~0.03-0.22), for a first real test of this
  # penalty rather than a value tuned from prior runs (there are none yet).
  channel_divergence_penalty: 0.3
  probe_batch_size: 256
  num_generations: 40
  top_k: 5
  random_seed: 0

trained_cppn:
  num_steps: 500
  probe_batch_size: 256
  lr: 0.01
  temperature: 4
  diversity_weight: 1.0
  kl_weight: 1.0
