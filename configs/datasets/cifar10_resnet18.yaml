dataset_name: cifar_10
model_name: resnet18
pretrained: true
input_channels: 3
num_classes: 10
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

teacher:
  # lr kept low relative to student's: teacher starts from pretrained
  # ImageNet weights (pretrained: true above) and is being fine-tuned, not
  # trained from scratch -- a from-scratch-appropriate lr like 0.1 here
  # wrecks the pretrained features early and left the teacher *worse* than
  # the from-scratch student in an earlier real run (78-81.5% vs 81.5-83.7%),
  # invalidating every KD comparison. step decay added since 100 epochs with
  # a flat lr is generally suboptimal for either regime.
  num_epochs: 100
  lr: 0.01
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1

student:
  num_epochs: 100
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1
  temperature: 4
  # alpha lowered from 0.9: cppn_weight (below) now draws from the same
  # fixed budget as alpha rather than being additive on top of it -- an
  # earlier additive version (attempt 6, EXPERIMENT_LOG.md) pushed total
  # non-hard-label weight to 1.2 and was actively harmful (kd_evolved_cppn
  # mean dropped further, instability came back). hard_weight is computed
  # as 1-alpha-cppn_weight = 0.1, so all three terms sum to 1. NOTE: `kd`
  # mode also reads this same alpha (no cppn_weight applies there), so this
  # run's `kd` baseline uses alpha=0.6, not the 0.9 used in attempts 2-6 --
  # not directly comparable across attempts, only within this run.
  alpha: 0.6
  # Independent weight for the CPPN-view consistency term, drawn from the
  # same fixed budget as alpha. Real-run evidence: kd_random_cppn (83.07%)
  # > kd_trained_cppn (82.50%) > kd_evolved_cppn (80.53%) in student
  # accuracy, tracking exactly how hard each was optimized to be different
  # from the raw image -- a genuinely diverse view is a harder, noisier
  # training signal. 0.3 is a starting point, not tuned.
  cppn_weight: 0.3

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  # tau_low raised from 0.3: with the OUTER_SIGMOID_SCALE range fix (see
  # src/cppn/compile.py), evolution can now reach high-contrast, near-binary
  # patterns (observed std=0.425, min=0.007/max=0.993 on a real run) that
  # amount to a static, always-in-the-same-place occlusion mask -- very
  # different from normal per-batch-random augmentation like Cutout, since
  # it's identical across every image and every epoch. 0.3 agreement on one
  # probe batch wasn't a strict enough bar to rule those out; kd_evolved_cppn
  # mean dropped further (78.7% -> 71.5%) after the range fix, with one seed
  # crashing to 61.8%. Raising the floor is a hypothesis, not a guaranteed
  # fix -- worth confirming it actually helps before trusting it.
  tau_low: 0.5
  tau_high: 0.7
  gamma: 0.0
  probe_batch_size: 256
  num_generations: 40
  top_k: 5
  random_seed: 0

trained_cppn:
  num_steps: 500
  probe_batch_size: 256
  lr: 0.01
  temperature: 4
  diversity_weight: 1.0
  kl_weight: 1.0
