dataset_name: cifar_10
model_name: resnet18
pretrained: true
input_channels: 3
num_classes: 10
image_size: 32
batch_size: 64
train_size_percent: 0.80
val_size_percent: 0.10
seed: 0
data_root: ./data

# CPPN-only loss ablation: for kd_random_cppn/kd_trained_cppn/kd_evolved_cppn,
# drop the raw-image soft-label KD term entirely (use_soft_kd: false below)
# -- loss becomes a strict two-part convex combination, (1-alpha)*hard_loss
# + alpha*cppn_loss, with no comparison against the teacher's prediction on
# the unmodified image at all. Isolates whether the CPPN-view consistency
# signal alone drives these modes' behavior, rather than it interacting
# with/being diluted by standard soft-label KD (which every prior attempt
# in cifar10_resnet18.yaml always included alongside it). Plain 'kd' mode
# is unaffected -- it has no CPPN view, so use_soft_kd is a no-op for it,
# it remains standard soft-label distillation.
#
# Otherwise a direct copy of cifar10_resnet18.yaml's validated settings
# (teacher recipe, fitness-function fixes through attempt 13) -- only
# student.alpha and student.use_soft_kd differ.

teacher:
  # see cifar10_resnet18.yaml for why teacher lr is kept low + decayed here.
  num_epochs: 100
  lr: 0.01
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1

student:
  num_epochs: 100
  lr: 0.1
  momentum: 0.9
  scheduler: true
  step_size: 30
  gamma: 0.1
  temperature: 4
  # 0.5/0.5 split between hard CE loss and the CPPN-view consistency loss
  # -- see use_soft_kd below and the top-of-file comment. Untuned first
  # value (a plain even split), not derived from any prior run of this
  # specific loss composition.
  alpha: 0.5
  use_soft_kd: false

cppn:
  neat_config: configs/neat/cppn_neat.cfg
  view_op: multiplicative
  view_scale: 0.5
  # see cifar10_resnet18.yaml for the full rationale behind every value
  # below -- unchanged from the validated attempt-13 config, this ablation
  # only changes the loss composition (student.alpha/use_soft_kd above),
  # not genome selection.
  tau_low: 0.5
  tau_high: 0.7
  gamma: 0.0
  contrast_penalty: 0.3
  contrast_std_threshold: 0.2
  channel_divergence_penalty: 0.3
  min_connections: 1
  min_pattern_std: 0.01
  probe_batch_size: 256
  num_generations: 40
  top_k: 5
  random_seed: 0

trained_cppn:
  num_steps: 500
  probe_batch_size: 256
  lr: 0.01
  temperature: 4
  diversity_weight: 1.0
  kl_weight: 1.0
