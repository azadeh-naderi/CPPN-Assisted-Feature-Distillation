# Phase 0 benchmark protocol for CIFAR-100, matching the standard KD
# benchmark (Tian et al., "Contrastive Representation Distillation", ICLR
# 2020; reference code RepDistiller, BSD-2-Clause) so the student_only/kd
# numbers here are directly comparable to published ones. See
# method_paper/EXPERIMENT_LOG.md for the published reference accuracies.

dataset: cifar100
data_root: ./data
num_workers: 4
# 0 = train on the full 50k training set and report on the official 10k
# test set, as the benchmark does. Set >0 to hold out a validation split
# for hyperparameter tuning in later phases.
val_size: 0

training:
  epochs: 240
  batch_size: 64
  lr: 0.05
  # lr for architectures in SMALL_LR_MODELS (method_paper/src/models/registry.py)
  small_model_lr: 0.01
  lr_milestones: [150, 180, 210]
  lr_decay: 0.1
  momentum: 0.9
  weight_decay: 5.0e-4

kd:
  temperature: 4
  alpha: 0.9   # KD term weight
  gamma: 0.1   # cross-entropy weight

# One teacher per architecture (seed teacher_seed), shared by every student
# seed that distills from it, as in the benchmark.
teacher_seed: 0
student_seeds: [0, 1, 2]

# Benchmark pairs (teachers / students stages). The first four are the
# Phase 0 development pairs (three same-family, one cross-architecture);
# the last two were added for the Phase 3 main table (published KD 73.08
# and 72.98). Finished runs are skipped, so rerunning the stages after
# adding pairs only trains what's new.
pairs:
  - {teacher: resnet56, student: resnet20}
  - {teacher: wrn_40_2, student: wrn_16_2}
  - {teacher: resnet32x4, student: resnet8x4}
  - {teacher: vgg13, student: mobilenetv2}
  - {teacher: resnet110, student: resnet32}
  - {teacher: vgg13, student: vgg8}

# ---------------------------------------------------------------------------
# Phase 1: corrected baselines. Each mode is a separate student run per
# pair x seed (the student_only and kd numbers come from Phase 0). Starts on
# the Gate 2 development pair only; add pairs once the numbers look sane.
phase1:
  pairs:
    - {teacher: resnet56, student: resnet20}
  modes:
    - kd_randaugment
    - kd_cutmix
    - kd_random_cppn
    - kd_trained_cppn
    - kd_evolved_cppn
    - kd_random_search

# Strong-augmentation KD baselines.
augment:
  randaugment: {num_ops: 2, magnitude: 9}   # torchvision RandAugment defaults
  cutmix: {alpha: 1.0, prob: 0.5}           # CutMix paper's CIFAR settings

# CPPN views (method_paper/src/views.py). Evolution settings are the main
# pipeline's attempt-14 configuration (configs/datasets/cifar100_resnet18.yaml),
# unchanged, so Gate 1 tests the existing method under the fixed protocol.
views:
  neat_config: configs/neat/cppn_neat.cfg   # relative to the repo root
  view_op: multiplicative
  view_scale: 0.5
  # loss = gamma*CE + alpha*((1 - view_weight)*KD(raw) + view_weight*KD(views));
  # 0.5 is the main pipeline's combined_loss form.
  view_weight: 0.5
  # all = every pattern on every batch (main pipeline behavior; costs one
  # extra student forward/backward per pattern); one = one pattern per batch.
  view_sampling: all
  probe_batch_size: 256
  evolution:
    num_generations: 40
    top_k: 5
    tau_low: 0.5
    tau_high: 0.7
    gamma: 0.0
    contrast_penalty: 0.3
    contrast_std_threshold: 0.2
    channel_divergence_penalty: 0.3
    min_connections: 1
    min_pattern_std: 0.01
    min_pattern_distance: 0.02
  # Same evaluation budget as evolution: pop_size x num_generations genomes.
  random_search:
    # Mutation rounds per sampled genome ~ Uniform{0..max_mutations}. An
    # evolved lineage gets at most one round per generation, so 40 matches
    # the deepest lineage evolution can produce.
    max_mutations: 40
  trained:
    num_steps: 500
    lr: 0.01
    temperature: 4
    diversity_weight: 1.0
    kl_weight: 1.0

# ---------------------------------------------------------------------------
# Phase 2: student-aware online view evolution (method_paper/src/online_views.py).
# Uses views.neat_config / view_op / view_scale / probe_batch_size and the
# guardrail penalties in views.evolution (min_connections, min_pattern_std,
# contrast and channel-divergence penalties, min_pattern_distance).
phase2:
  pairs:
    - {teacher: resnet56, student: resnet20}
  modes:
    - kd_online_disagree    # fitness (a): teacher-student disagreement
    - kd_online_gradalign   # fitness (b): KD-gradient / CE-gradient alignment
    - kd_online_teacher     # old teacher-only fitness, re-evolved online (ablation)

# ---------------------------------------------------------------------------
# Phase 3 (slurm/phase3_main.sbatch, slurm/phase3_ablations.sbatch).
# Set `method` to Gate 2's winner (with any tuned settings applied via
# `method_set`) before launching. student_only and kd for every pair come
# from the teachers / students stages.
phase3:
  method: kd_online_disagree
  # Tuned settings for the method, e.g. [online.gate.tau_low=0.5]; when
  # non-empty its runs are tagged method_tag so they never mix with the
  # untuned Phase 2 runs.
  method_set: []
  method_tag: tuned
  # Main table: every benchmark pair above x (these baselines + method) x seeds.
  main_baselines:
    - kd_cutmix
  # Ablations: on the development pair, `method` with each override set.
  # Each gets its own tagged run directory.
  ablation_pair: {teacher: resnet56, student: resnet20}
  ablations:
    - {tag: every10, set: [online.evolve_every=10]}        # re-evolution frequency N
    - {tag: every40, set: [online.evolve_every=40]}
    - {tag: average, set: [online.view_sampling=all]}      # all top-K views every batch vs one sampled
    - {tag: nojitter, set: [online.pattern_shift=0, online.pattern_flip=false]}
    - {tag: rsearch, set: [online.search=random]}          # evolution vs random search, same fitness/budget
    - {tag: randviews, set: [online.search=none]}          # no selection at all
    - {tag: noise, set: [online.family=noise]}             # CPPN vs noise masks
  # Fitness (a) vs (b) vs old is covered by the phase2 modes.

# ---------------------------------------------------------------------------
# Fitness-vs-accuracy study (analysis paper; src/fitness_study.py,
# scripts/fitness_study.py, slurm/fitness_study_*.sbatch). Does the
# teacher-only fitness predict how much a view helps the student?
fitness_study:
  teacher: resnet56
  student: resnet20
  # Bank: half from a NEAT run, half from an equal-budget random search
  # (views.evolution / views.random_search settings), at evenly spaced
  # fitness quantiles of each pool, then rescored on one shared probe set.
  num_genomes: 40
  generations: 40
  rescore_probe_size: 1024
  bank_seed: 0
  # Short student runs: one per bank view per seed, plus kd on the same
  # schedule as the reference. Milestones keep the 240-epoch schedule's
  # proportions (150/180/210 of 240).
  epochs: 60
  lr_milestones: [37, 45, 52]
  seeds: [0, 1]
  kd_seeds: [0, 1, 2]
  index: null   # set per job by the fitness_study stage

# Hyperparameter tuning (slurm/tune.sbatch): always run with
# --set val_size=5000 and compare val_final, never test accuracy. Array
# indices: kd = 0-2 (the reference, run once), method = 3-5 (one tagged
# submission per variant).
tune:
  pairs:
    - {teacher: resnet56, student: resnet20}
  modes:
    - kd
    - kd_online_disagree

online:
  # Re-evolve at epochs 0, 20, 40, ... from the same (warm-started)
  # population: initial_generations at epoch 0, generations_per_round after.
  # 10 + 11 x 5 = 65 generations x 150 genomes over a 240-epoch run.
  evolve_every: 20
  initial_generations: 10
  generations_per_round: 5
  top_k: 5
  # One view per batch, sampled from the current top-K, randomly shifted by
  # up to 4 px and flipped -- a per-batch augmentation, not a fixed mask.
  view_sampling: one
  pattern_shift: 4
  pattern_flip: true
  view_weight: 0.5
  # Gate for the student-aware fitnesses, on the teacher's accuracy on the
  # view relative to the raw probe images: 0 at <= tau_low, full at >= tau_high.
  # Untuned starting point.
  gate: {tau_low: 0.6, tau_high: 0.9}
  # Phase 3 controls (src/online_views.py): search = neat (the method) |
  # random (same fitness and budget, random genomes) | none (unscored random
  # genomes); family = cppn | noise (low-frequency noise masks, no search).
  search: neat
  family: cppn
